<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Premier League Standings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #37003c 0%, #00ff87 100%);
            min-height: 100vh;
            padding: 18px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: #37003c;
            color: white;
            padding: 4.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13.5px;
        }

        .fpl-logo {
            width: 132px;
            height: 132px;
            object-fit: contain;
        }

        .storebrand-logo {
            width: 96px;
            height: 96px;
            object-fit: contain;
            margin-left: 9px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .standings {
            padding: 18px;
        }

        .standings h2 {
            color: #37003c;
            margin-bottom: 13.5px;
            font-size: 1.8rem;
            text-align: center;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #37003c;
            color: white;
            padding: 12.15px 10.8px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95rem;
        }

        td {
            padding: 12.15px 10.8px;
            border-bottom: 1px solid #eee;
        }

        tr:hover td {
            background-color: #f8f9fa;
        }

        tr:nth-child(even) td {
            background-color: #fafafa;
        }

        .position {
            font-weight: bold;
            color: #37003c;
            text-align: center;
            width: 60px;
            position: relative;
            font-variant-numeric: tabular-nums;
        }

        .rank-change {
            font-size: 1.5rem;
            font-weight: bold;
            display: inline-block;
            line-height: 1;
            vertical-align: middle;
            width: 20px;
            text-align: center;
        }

        .rank-number {
            display: inline-block;
            width: 24px;
            text-align: right;
            vertical-align: middle;
        }

        .team-name {
            font-weight: 600;
            color: #333;
        }

        .manager-name {
            color: #666;
            font-style: italic;
        }

        .points {
            font-weight: bold;
            text-align: center;
        }

        .total-points {
            color: #37003c;
            font-size: 1.1rem;
        }

        .gw-points {
            color: #37003c;
        }

        .loading, .error {
            text-align: center;
            padding: 45px;
            font-size: 1.1rem;
        }

        .error {
            color: #dc3545;
        }

        .last-updated {
            text-align: center;
            margin-top: 18px;
            color: #666;
            font-size: 0.9rem;
        }

        .club-badge {
            display: inline-block;
            width: 32px;
            height: 32px;
            border-radius: 3px;
            margin-right: 7.2px;
            vertical-align: middle;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .badge-arsenal { background-image: url('logos/clubs/arsenal.svg'); }
        .badge-chelsea { background-image: url('logos/clubs/chelsea.svg'); }
        .badge-liverpool { background-image: url('logos/clubs/liverpool.svg'); }
        .badge-city { background-image: url('logos/clubs/manchester-city.svg'); }
        .badge-united { background-image: url('logos/clubs/manchester-united.svg'); }
        .badge-tottenham { background-image: url('logos/clubs/tottenham.svg'); }
        .badge-newcastle { background-image: url('logos/clubs/newcastle.svg'); }
        .badge-brighton { background-image: url('logos/clubs/brighton.svg'); }
        .badge-west-ham { background-image: url('logos/clubs/west-ham.svg'); }
        .badge-everton { background-image: url('logos/clubs/everton.svg'); }
        .badge-aston-villa { background-image: url('logos/clubs/aston-villa.svg'); }
        .badge-crystal-palace { background-image: url('logos/clubs/crystal-palace.svg'); }
        .badge-brentford { background-image: url('logos/clubs/brentford.svg'); }
        .badge-fulham { background-image: url('logos/clubs/fulham.svg'); }
        .badge-wolves { background-image: url('logos/clubs/wolves.svg'); }
        .badge-leicester { background-image: url('logos/clubs/leicester.svg'); }
        .badge-bournemouth { background-image: url('logos/clubs/bournemouth.svg'); }
        .badge-nottingham { background-image: url('logos/clubs/nottingham-forest.svg'); }
        .badge-luton { background-image: url('logos/clubs/luton.svg'); }
        .badge-burnley { background-image: url('logos/clubs/burnley.svg'); }

        .rank-up {
            color: #28a745;
            animation: upColorWave 2s ease-in-out infinite;
            background: linear-gradient(to top, #28a745, #4ade80, #28a745);
            background-size: 100% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .rank-down {
            color: #dc3545;
            animation: downColorWave 2s ease-in-out infinite;
            background: linear-gradient(to bottom, #dc3545, #f87171, #dc3545);
            background-size: 100% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes upColorWave {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: 0% 100%;
            }
        }

        @keyframes downColorWave {
            0% {
                background-position: 0% 100%;
            }
            100% {
                background-position: 0% 0%;
            }
        }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .header {
                flex-direction: column;
                padding: 15px 10px;
                gap: 10px;
            }
            .fpl-logo { width: 80px; height: 80px; }
            .storebrand-logo {
                width: 60px;
                height: 60px;
                margin-left: 0;
                margin-top: 5px;
            }
            .header h1 { font-size: 1.5rem; }
            .standings { padding: 10px; }
            .standings h2 { font-size: 1.4rem; margin-bottom: 10px; }
            th, td { padding: 8px 4px; font-size: 0.75rem; }
            th {
                white-space: normal;
                word-wrap: break-word;
                line-height: 1.2;
                padding: 6px 2px;
                text-align: center;
            }
            .club-badge {
                display: none;
            }
            .position { width: 40px; }
            .team-name {
                max-width: none;
                overflow: visible;
                text-overflow: clip;
                white-space: normal;
            }
            .manager-name {
                max-width: none;
                overflow: visible;
                text-overflow: clip;
                white-space: normal;
            }
            .last-updated { font-size: 0.8rem; margin-top: 10px; padding: 0 5px; }
        }

        @media (max-width: 480px) {
            .header h1 { font-size: 1.2rem; }
            .fpl-logo { width: 60px; height: 60px; }
            .storebrand-logo { width: 45px; height: 45px; }
            .standings h2 { font-size: 1.2rem; }
            th, td { padding: 6px 2px; font-size: 0.7rem; }
            th {
                white-space: normal;
                word-wrap: break-word;
                line-height: 1.1;
                padding: 4px 1px;
                text-align: center;
            }
            .team-name {
                max-width: none;
                overflow: visible;
                text-overflow: clip;
                white-space: normal;
            }
            .manager-name {
                max-width: none;
                overflow: visible;
                text-overflow: clip;
                white-space: normal;
            }
            .club-badge {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logos/fantasyLeague.png" alt="FPL Logo" class="fpl-logo">
            <h1>Fantasy Premier League</h1>
            <img src="logos/storebrand.svg" alt="Storebrand Logo" class="storebrand-logo">
        </div>

        <div class="standings">
            <h2>Current Standings</h2>
            <div id="standings-content">
                <div class="loading">Loading standings...</div>
            </div>
            <div class="last-updated" id="last-updated"></div>
        </div>
    </div>

    <script>
        const LEAGUE_ID = '1370073';
        const API_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://fantasy.premierleague.com/api/leagues-classic/' + LEAGUE_ID + '/standings/')}`;
        const RETRY_INTERVAL = 60000;

        async function fetchStandings() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const data = await response.json();
                displayStandings(data);
            } catch (error) {
                document.getElementById('standings-content').innerHTML =
                    `<div class="error">Failed to load standings. Retrying in 1 minute...<br><small>${error.message}</small></div>`;
            }
        }

        function displayStandings(data) {
            const standings = data.standings.results;
            const leagueName = data.league ? data.league.name : 'Current Standings';
            document.querySelector('.standings h2').textContent = leagueName;

            const clubBadges = [
                { class: 'badge-arsenal' }, { class: 'badge-chelsea' }, { class: 'badge-liverpool' },
                { class: 'badge-city' }, { class: 'badge-united' }, { class: 'badge-tottenham' },
                { class: 'badge-newcastle' }, { class: 'badge-brighton' }, { class: 'badge-west-ham' },
                { class: 'badge-everton' }, { class: 'badge-aston-villa' }, { class: 'badge-crystal-palace' },
                { class: 'badge-brentford' }, { class: 'badge-fulham' }, { class: 'badge-wolves' },
                { class: 'badge-leicester' }, { class: 'badge-bournemouth' }, { class: 'badge-nottingham' },
                { class: 'badge-luton' }, { class: 'badge-burnley' }
            ];

            const shuffledBadges = [...clubBadges].sort(() => 0.5 - Math.random());

            let tableHTML = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Position</th>
                                <th>Team Name</th>
                                <th>Manager</th>
                                <th>GW Points</th>
                                <th>Total Points</th>
                            </tr>
                        </thead>
                        <tbody>`;

            standings.forEach((team, index) => {
                const badgeIndex = index % shuffledBadges.length;
                const assignedBadge = shuffledBadges[badgeIndex];

                let rankChangeIcon = '';
                if (team.last_rank) {
                    if (team.rank < team.last_rank) {
                        rankChangeIcon = '<span class="rank-change rank-up">↑</span>';
                    } else if (team.rank > team.last_rank) {
                        rankChangeIcon = '<span class="rank-change rank-down">↓</span>';
                    } else if (team.rank === team.last_rank) {
                        rankChangeIcon = '<span class="rank-change">↕</span>';
                    }
                } else {
                    // Temporary test - add random arrows to see animations
                    const testArrows = ['<span class="rank-change rank-up">↑</span>', '<span class="rank-change rank-down">↓</span>', '<span class="rank-change">↕</span>'];
                    rankChangeIcon = testArrows[index % 3];
                }

                tableHTML += `
                    <tr>
                        <td class="position">${rankChangeIcon}<span class="rank-number">${team.rank}</span></td>
                        <td class="team-name">
                            <span class="club-badge ${assignedBadge.class}"></span>
                            ${team.entry_name}
                        </td>
                        <td class="manager-name">${team.player_name}</td>
                        <td class="points gw-points">${team.event_total}</td>
                        <td class="points total-points">${team.total.toLocaleString()}</td>
                    </tr>`;
            });

            tableHTML += `</tbody></table></div>`;
            document.getElementById('standings-content').innerHTML = tableHTML;
            document.getElementById('last-updated').innerHTML = `Last updated: ${new Date().toLocaleString()}`;
        }

        function startContinuousPolling() {
            setTimeout(() => {
                fetchStandings();
                startContinuousPolling();
            }, RETRY_INTERVAL);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchStandings();
            startContinuousPolling();
        });
    </script>
</body>
</html>
