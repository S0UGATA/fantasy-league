<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Fantasy Premier League Standings</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #37003c 0%, #00ff87 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: #37003c;
            color: white;
            padding: 5px;
            text-align: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .fpl-logo {
            width: 132px;
            height: 132px;
            object-fit: contain;
        }

        .storebrand-logo {
            width: 96px;
            height: 96px;
            object-fit: contain;
            margin-left: 10px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .standings {
            padding: 20px;
        }

        .standings h2 {
            color: #37003c;
            margin-bottom: 15px;
            font-size: 1.8rem;
            text-align: center;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #37003c;
            color: white;
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.95rem;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 15px 12px;
            border-bottom: 1px solid #eee;
            transition: background-color 0.3s ease;
        }

        tr:hover td {
            background-color: #f8f9fa;
        }

        tr:nth-child(even) td {
            background-color: #fafafa;
        }

        .position {
            font-weight: bold;
            color: #37003c;
            text-align: center;
            width: 60px;
        }

        .rank-change {
            margin-left: 5px;
            font-size: 0.8rem;
        }

        .rank-up {
            color: #28a745;
        }

        .rank-down {
            color: #dc3545;
        }

        .team-name {
            font-weight: 600;
            color: #333;
        }

        .manager-name {
            color: #666;
            font-style: italic;
        }

        .points {
            font-weight: bold;
            text-align: center;
        }

        .total-points {
            color: #37003c;
            font-size: 1.1rem;
        }

        .gw-points {
            color: #37003c;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #666;
            font-size: 1.1rem;
        }

        .error {
            text-align: center;
            padding: 50px;
            color: #dc3545;
            font-size: 1.1rem;
        }

        .last-updated {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 0.9rem;
        }

        .club-badge {
            display: inline-block;
            width: 32px;
            height: 32px;
            border-radius: 3px;
            margin-right: 8px;
            vertical-align: middle;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        .badge-arsenal {
            background: url('logos/clubs/arsenal.svg') center/28px no-repeat;
        }
        .badge-chelsea {
            background: url('logos/clubs/chelsea.svg') center/28px no-repeat;
        }
        .badge-liverpool {
            background: url('logos/clubs/liverpool.svg') center/28px no-repeat;
        }
        .badge-city {
            background: url('logos/clubs/manchester-city.svg') center/28px no-repeat;
        }
        .badge-united {
            background: url('logos/clubs/manchester-united.svg') center/28px no-repeat;
        }
        .badge-tottenham {
            background: url('logos/clubs/tottenham.svg') center/28px no-repeat;
        }
        .badge-newcastle {
            background: url('logos/clubs/newcastle.svg') center/28px no-repeat;
        }
        .badge-brighton {
            background: url('logos/clubs/brighton.svg') center/28px no-repeat;
        }
        .badge-west-ham {
            background: url('logos/clubs/west-ham.svg') center/28px no-repeat;
        }
        .badge-everton {
            background: url('logos/clubs/everton.svg') center/28px no-repeat;
        }
        .badge-aston-villa {
            background: url('logos/clubs/aston-villa.svg') center/28px no-repeat;
        }
        .badge-crystal-palace {
            background: url('logos/clubs/crystal-palace.svg') center/28px no-repeat;
        }
        .badge-brentford {
            background: url('logos/clubs/brentford.svg') center/28px no-repeat;
        }
        .badge-fulham {
            background: url('logos/clubs/fulham.svg') center/28px no-repeat;
        }
        .badge-wolves {
            background: url('logos/clubs/wolves.svg') center/28px no-repeat;
        }
        .badge-leicester {
            background: url('logos/clubs/leicester.svg') center/28px no-repeat;
        }
        .badge-bournemouth {
            background: url('logos/clubs/bournemouth.svg') center/28px no-repeat;
        }
        .badge-nottingham {
            background: url('logos/clubs/nottingham-forest.svg') center/28px no-repeat;
        }
        .badge-luton {
            background: url('logos/clubs/luton.svg') center/28px no-repeat;
        }
        .badge-burnley {
            background: url('logos/clubs/burnley.svg') center/28px no-repeat;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }

            th, td {
                padding: 10px 8px;
                font-size: 0.9rem;
            }

            .container {
                margin: 10px;
                border-radius: 8px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="logos/fantasyLeague.png" alt="FPL Logo" class="fpl-logo">
        <h1>Fantasy Premier League</h1>
        <img src="logos/storebrand.svg" alt="Storebrand Logo" class="storebrand-logo">
    </div>

    <div class="standings">
        <h2>Current Standings</h2>
        <div id="standings-content">
            <div class="loading">Loading standings...</div>
        </div>
        <div class="last-updated" id="last-updated"></div>
    </div>
</div>

<script>
        const LEAGUE_ID = '1370073';
        const API_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent('https://fantasy.premierleague.com/api/leagues-classic/' + LEAGUE_ID + '/standings/')}`;
        const RETRY_INTERVAL = 60000; // 1 minute

        async function fetchStandings() {
            try {
                console.log('Fetching standings...');
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                console.log('Successfully fetched data');
                displayStandings(data);

            } catch (error) {
                console.error('Fetch failed:', error.message);
                document.getElementById('standings-content').innerHTML =
                    `<div class="error">Failed to load standings. Retrying in 1 minute...<br><small>${error.message}</small></div>`;
            }
        }

        function startContinuousPolling() {
            // Schedule next fetch in 1 minute
            setTimeout(() => {
                fetchStandings();
                startContinuousPolling();
            }, RETRY_INTERVAL);
        }

        function displayStandings(data) {
            const standings = data.standings.results;
            const leagueName = data.league ? data.league.name : 'Current Standings';

            // Update the standings heading with the actual league name
            document.querySelector('.standings h2').textContent = leagueName;

            // Array of Premier League club badges with initials and CSS classes
            const clubBadges = [
                { initials: 'ARS', class: 'badge-arsenal' },
                { initials: 'CHE', class: 'badge-chelsea' },
                { initials: 'LIV', class: 'badge-liverpool' },
                { initials: 'MCI', class: 'badge-city' },
                { initials: 'MUN', class: 'badge-united' },
                { initials: 'TOT', class: 'badge-tottenham' },
                { initials: 'NEW', class: 'badge-newcastle' },
                { initials: 'BHA', class: 'badge-brighton' },
                { initials: 'WHU', class: 'badge-west-ham' },
                { initials: 'EVE', class: 'badge-everton' },
                { initials: 'AVL', class: 'badge-aston-villa' },
                { initials: 'CRY', class: 'badge-crystal-palace' },
                { initials: 'BRE', class: 'badge-brentford' },
                { initials: 'FUL', class: 'badge-fulham' },
                { initials: 'WOL', class: 'badge-wolves' },
                { initials: 'LEI', class: 'badge-leicester' },
                { initials: 'BOU', class: 'badge-bournemouth' },
                { initials: 'NFO', class: 'badge-nottingham' },
                { initials: 'LUT', class: 'badge-luton' },
                { initials: 'BUR', class: 'badge-burnley' }
            ];

            // Shuffle the badges array to get unique assignments
            const shuffledBadges = [...clubBadges].sort(() => 0.5 - Math.random());

            let tableHTML = `
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Position</th>
                                <th>Team Name</th>
                                <th>Manager</th>
                                <th>GW Points</th>
                                <th>Total Points</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            standings.forEach((team, index) => {
                // Get a unique badge for each manager (cycle through if more teams than badges)
                const badgeIndex = index % shuffledBadges.length;
                const assignedBadge = shuffledBadges[badgeIndex];

                // Determine rank change indicator
                let rankChangeIcon = '';
                if (team.last_rank) {
                    if (team.rank < team.last_rank) {
                        rankChangeIcon = '<span class="rank-change rank-up">↑</span>';
                    } else if (team.rank > team.last_rank) {
                        rankChangeIcon = '<span class="rank-change rank-down">↓</span>';
                    } else if (team.rank === team.last_rank) {
                        rankChangeIcon = '<span class="rank-change">↕</span>';
                    }
                }

                tableHTML += `
                    <tr>
                        <td class="position">${team.rank}${rankChangeIcon}</td>
                        <td class="team-name">${team.entry_name}</td>
                        <td class="manager-name">
                            <span class="club-badge ${assignedBadge.class}"></span>
                            ${team.player_name}
                        </td>
                        <td class="points gw-points">${team.event_total}</td>
                        <td class="points total-points">${team.total.toLocaleString()}</td>
                    </tr>
                `;
            });

            tableHTML += `
                        </tbody>
                    </table>
                </div>
            `;

            document.getElementById('standings-content').innerHTML = tableHTML;
            document.getElementById('last-updated').innerHTML =
                `Last updated: ${new Date().toLocaleString()}`;
        }

        // Load standings when page loads
        document.addEventListener('DOMContentLoaded', () => {
            fetchStandings(); // Initial immediate load
            startContinuousPolling(); // Start continuous polling
        });
    </script>
</body>
</html>
